<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سولاند - Soland | قريباً</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 5px solid #2ea44f; /* لون جيت هاب الأخضر */
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #24292e;
        }
        p {
            font-size: 1.2rem;
            color: #666;
        }
        .loading {
            margin-top: 20px;
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0,0,0,.1);
            border-radius: 50%;
            border-top-color: #2ea44f;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>سولاند | Soland</h1>
        <p>الموقع تحت الإنشاء...</p>
        <div class="loading"></div>
        <p style="font-size: 0.9rem; margin-top: 20px; color: #aaa;">  </p>
    </div>

</body>
</html>
